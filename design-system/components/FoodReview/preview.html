<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body>

<div class="dag-pad" style="max-width:390px">
  <div class="dag-card dag-food" data-open="true">
    <div class="dag-food__toggle"><span data-icon="food"></span><span class="dag-food__q">¿Comiste algo?</span><button class="dag-switch" role="switch" aria-checked="true" aria-label="Comí algo"></button></div>
    <div class="dag-food__body">
      <label class="dag-field"><span class="dag-label">¿Qué?</span><input class="dag-input" value="Medialuna de manteca"></label>
      <div class="dag-field"><span class="dag-label">Nota de la comida</span><div class="dag-picker dag-picker--compact"><div class="dag-picker__scale" role="group" aria-label="Nota del 1 al 10"><button type="button" class="dag-picker__opt" aria-pressed="false">1</button><button type="button" class="dag-picker__opt" aria-pressed="false">2</button><button type="button" class="dag-picker__opt" aria-pressed="false">3</button><button type="button" class="dag-picker__opt" aria-pressed="false">4</button><button type="button" class="dag-picker__opt" aria-pressed="false">5</button><button type="button" class="dag-picker__opt" aria-pressed="false">6</button><button type="button" class="dag-picker__opt" aria-pressed="false">7</button><button type="button" class="dag-picker__opt" aria-pressed="true">8</button><button type="button" class="dag-picker__opt" aria-pressed="false">9</button><button type="button" class="dag-picker__opt" aria-pressed="false">10</button></div></div></div>
      <label class="dag-field"><span class="dag-label">Comentario</span><input class="dag-input" placeholder="Opcional" value="Hojaldrada, recién horneada."></label>
    </div>
  </div>
</div>
<script>DirectoAlGrano.hydrate();</script>
</body>
</html>
