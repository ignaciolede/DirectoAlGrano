<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body>

<div class="dag-pad" style="max-width:390px">
  <div class="dag-map" style="height:540px">
    <svg class="dag-map__base" viewBox="0 0 400 640" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect class="land" width="400" height="640"/><path class="water" d="M250 -10 C 300 120 420 140 420 260 L 420 -10 Z"/><rect class="water" x="40" y="400" width="120" height="90" rx="14"/><g class="road" stroke-width="7"><path d="M-10 80H410M-10 200H410M-10 330H410M-10 520H410M60 -10V650M180 -10V650M300 -10V650"/></g><g class="road" stroke-width="3.5"><path d="M-10 140H410M-10 265H410M-10 400H410M-10 460H410M-10 590H410M120 -10V650M240 -10V650M360 -10V650"/></g><path class="road" stroke-width="12" d="M-20 610 L 430 120"/></svg>
    <button class="dag-pin" data-score="9.5" aria-pressed="true" style="left:38%;top:30%"><span class="dag-pin__body">9,5</span><span class="dag-pin__tip"></span></button>
    <button class="dag-pin" data-score="8.5" style="left:70%;top:46%"><span class="dag-pin__body">8,5</span><span class="dag-pin__tip"></span></button>
    <button class="dag-pin" data-score="6" style="left:22%;top:58%"><span class="dag-pin__body">6</span><span class="dag-pin__tip"></span></button>
    <button class="dag-pin dag-pin--wish" style="left:82%;top:22%" aria-label="Wishlist: Ventana Café"><span class="dag-pin__body"><span data-icon="wishlist"></span></span><span class="dag-pin__tip"></span></button>
    <span class="dag-me" style="left:52%;top:52%"></span>
    <div class="dag-sheet" style="position:absolute;left:0;right:0;bottom:0">
      <div class="dag-sheet__grip"></div>
      <div style="display:flex;gap:12px;align-items:center">
        <span class="dag-score dag-score--lg" data-score="9.5"></span>
        <div style="flex:1;min-width:0"><p class="dag-title">Grano Norte</p><p class="dag-cafe__meta">Colegiales · a 650 m</p></div>
        <button class="dag-btn dag-btn--secondary dag-btn--icon" aria-label="Cómo llegar"><span data-icon="route"></span></button>
      </div>
    </div>
  </div>
</div>
<script>DirectoAlGrano.hydrate();</script>
</body>
</html>
