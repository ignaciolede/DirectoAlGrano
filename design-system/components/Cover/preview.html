<!doctype html>
<html lang="es">
<head><meta charset="utf-8">
<style>
  html, body { margin: 0; background: var(--surface); }
  .cv { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--surface); }
  .cv svg { position: absolute; inset: 0; }
  .brand { fill: var(--brand); }
  .ink { fill: var(--ink); }
  .accent { fill: var(--accent); }
  .green { fill: var(--bean-green); }
  .bean { fill: var(--brand-tint); }
  .crease { stroke: var(--brand); stroke-width: 3; stroke-linecap: round; fill: none; }
  .slab, .blk { rx: var(--radius-lg); }
  .txt { position: absolute; left: 48px; bottom: 36px; max-width: 440px; }
  .name { font-family: var(--font-display); font-weight: 600; font-size: 80px; line-height: .95; letter-spacing: -2px; color: var(--ink); margin: 0; }
  .name em { font-style: italic; font-weight: 500; color: var(--brand); }
  .tag { font-family: var(--font-sans); font-size: 14px; line-height: 20px; color: var(--ink-muted); margin: 12px 0 0; }
</style></head>
<body>
<div class="cv">
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <!-- blocks: brand slab 208×312 (bleeds top/bottom), ink 152×208 (bleeds right/bottom), accent disc r48 (space-24×4/2), bean-green pill 96×72 rx36
         arrangement: one tall slab with satellites, right of x=480
         pattern: literal motif — the brand's straight-crease bean (ellipse from radius-lg proportions, rotated 35°), 12 units; the README calls the bean the brand's mark and its unit of rating
         steps & radii: pitch 64 (space-8×2), offsets space-6/space-8, corners radius-lg, pill radius-pill (half the short side) -->
    <circle class="accent" cx="536" cy="200" r="48"/>
    <rect class="slab brand" x="608" y="-24" width="208" height="336"/>
    <rect class="green" x="840" y="24" width="96" height="72" rx="36"/>
    <rect class="blk ink" x="840" y="120" width="152" height="200"/>
    <g>
      <g transform="translate(648 40)"><ellipse class="bean" rx="13" ry="20" transform="rotate(35)"/><path class="crease" d="M7.5 -10.6 -7.5 10.6"/></g>
      <g transform="translate(712 40)"><ellipse class="bean" rx="13" ry="20" transform="rotate(35)"/><path class="crease" d="M7.5 -10.6 -7.5 10.6"/></g>
      <g transform="translate(776 40)"><ellipse class="bean" rx="13" ry="20" transform="rotate(35)"/><path class="crease" d="M7.5 -10.6 -7.5 10.6"/></g>
      <g transform="translate(648 104)"><ellipse class="bean" rx="13" ry="20" transform="rotate(35)"/><path class="crease" d="M7.5 -10.6 -7.5 10.6"/></g>
      <g transform="translate(712 104)"><ellipse class="bean" rx="13" ry="20" transform="rotate(35)"/><path class="crease" d="M7.5 -10.6 -7.5 10.6"/></g>
      <g transform="translate(776 104)"><ellipse class="bean" rx="13" ry="20" transform="rotate(35)"/><path class="crease" d="M7.5 -10.6 -7.5 10.6"/></g>
      <g transform="translate(648 168)"><ellipse class="bean" rx="13" ry="20" transform="rotate(35)"/><path class="crease" d="M7.5 -10.6 -7.5 10.6"/></g>
      <g transform="translate(712 168)"><ellipse class="bean" rx="13" ry="20" transform="rotate(35)"/><path class="crease" d="M7.5 -10.6 -7.5 10.6"/></g>
      <g transform="translate(776 168)"><ellipse class="bean" rx="13" ry="20" transform="rotate(35)"/><path class="crease" d="M7.5 -10.6 -7.5 10.6"/></g>
      <g transform="translate(648 232)"><ellipse class="bean" rx="13" ry="20" transform="rotate(35)"/><path class="crease" d="M7.5 -10.6 -7.5 10.6"/></g>
      <g transform="translate(712 232)"><ellipse class="bean" rx="13" ry="20" transform="rotate(35)"/><path class="crease" d="M7.5 -10.6 -7.5 10.6"/></g>
      <g transform="translate(776 232)"><ellipse class="bean" rx="13" ry="20" transform="rotate(35)"/><path class="crease" d="M7.5 -10.6 -7.5 10.6"/></g>
    </g>
  </svg>
  <div class="txt">
    <p class="name">Directo <em>al</em><br>grano</p>
    <p class="tag">Tu ranking personal de cafeterías. Sin vueltas.</p>
  </div>
</div>
</body>
</html>
