<!doctype html>
<html lang="es-AR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6efe4">
  <meta name="description" content="Tu ranking personal de cafeterías. Sin vueltas.">
  <!-- App en la pantalla de inicio (iOS y Android) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Al grano">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Directo al grano</title>
  <link rel="icon" type="image/svg+xml" href="../design-system/assets/Logos/app-icon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Mapa real: Leaflet 1.9.4 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <!-- Sistema de diseño: tokens + componentes dag- (fuente única, sin copias) -->
  <link rel="stylesheet" href="../design-system/tokens.css">
  <link rel="stylesheet" href="../design-system/components/bundle.css">
  <link rel="stylesheet" href="app.css">
</head>
<body class="no-tabbar">
  <main class="app" id="view" aria-live="polite"><div class="app-boot" aria-label="Cargando"><img class="app-boot__mark" src="../design-system/assets/Logos/mark-tostado.svg" alt="" width="56" height="56"></div></main>

  <nav class="dag-tabbar app-tabbar" id="tabbar" aria-label="Secciones">
    <a class="dag-tab" data-tab="ranking" href="#/ranking"><span data-icon="ranking"></span>Ranking</a>
    <a class="dag-tab" data-tab="mapa" href="#/mapa"><span data-icon="map"></span>Mapa</a>
    <a class="dag-fab" href="#/nueva" aria-label="Nueva review"><span data-icon="plus"></span></a>
    <a class="dag-tab" data-tab="wishlist" href="#/wishlist"><span data-icon="wishlist"></span>Wishlist</a>
    <a class="dag-tab" data-tab="diario" href="#/diario"><span data-icon="journal"></span>Diario</a>
  </nav>

  <div class="app-toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    // Tema antes de pintar, para no parpadear en Espresso
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem('directo-al-grano.prefs')) || (JSON.parse(localStorage.getItem('directo-al-grano.v1')) || {}).prefs || {};
        var t = p.theme && p.theme !== 'system' ? p.theme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <script src="../design-system/components/bundle.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <!-- Cuenta y base de datos: Supabase JS 2.49.4 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js" integrity="sha384-rwykjmWNwVxboyFmvK9OXN0wj9hnMHA2aAHtits54DuACyCq0M2PrSNxhRb+hvXT" crossorigin="anonymous"></script>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
  </script>
</body>
</html>
