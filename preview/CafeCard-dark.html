<!doctype html>
<html lang="es" data-theme="dark">
<head><style>:root, [data-theme="light"]{--surface:#f6efe4;--surface-raised:#fffaf3;--surface-sunk:#ece1cf;--line:#ddcdb4;--line-strong:#957b5c;--ink:#24170f;--ink-muted:#6b5544;--brand:#8c4518;--on-brand:#fffaf3;--brand-tint:#f1dcc8;--accent:#e2a63c;--on-accent:#24170f;--bean-green:#4a6436;--bean-green-tint:#e1e8d3;--danger:#a8341c;--focus:var(--brand);--map-land:#e9dcc6;--map-road:#fffaf3;--map-water:#c8d5cb;--shadow-card:0 1px 2px rgba(36,23,15,0.06), 0 4px 14px rgba(36,23,15,0.06);--shadow-float:0 8px 28px rgba(36,23,15,0.18);}
[data-theme="dark"]{--surface:#16100b;--surface-raised:#221912;--surface-sunk:#0e0906;--line:#3b2d21;--line-strong:#85705b;--ink:#f4eadb;--ink-muted:#bba791;--brand:#e3925a;--on-brand:#1a0f08;--brand-tint:#3a2416;--accent:#e8b24f;--on-accent:#1a0f08;--bean-green:#a9c08a;--bean-green-tint:#252f1b;--danger:#f08a72;--focus:var(--brand);--map-land:#1d1610;--map-road:#2e241b;--map-water:#14201c;--shadow-card:0 1px 2px rgba(0,0,0,0.4);--shadow-float:0 8px 28px rgba(0,0,0,0.55);}
:root{--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--space-8:32px;--radius-sm:8px;--radius-md:14px;--radius-lg:24px;--radius-pill:999px;--font-display:Fraunces, Georgia, serif;--font-sans:"Instrument Sans", system-ui, sans-serif;}
@import url("https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Instrument+Sans:wght@400;500;600&display=swap");

/* Directo al grano — componentes (CSS puro, prefijo dag-) */

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--surface);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 24px;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
:where(button, input, textarea, [tabindex]):focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

/* ---------- utilidades ---------- */
.dag-stack { display: flex; flex-direction: column; gap: var(--space-3); }
.dag-row { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.dag-pad { padding: var(--space-4); }
.dag-label {
  font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .8px;
  text-transform: uppercase; color: var(--ink-muted); margin: 0;
}
.dag-muted { color: var(--ink-muted); }
.dag-title { font-family: var(--font-display); font-weight: 600; font-size: 18px; line-height: 24px; margin: 0; }
.dag-display { font-family: var(--font-display); font-weight: 600; font-size: 34px; line-height: 38px; letter-spacing: -.6px; margin: 0; }
.dag-icon { width: 24px; height: 24px; flex: none; display: inline-block; }
.dag-icon svg { width: 100%; height: 100%; display: block; }

/* ---------- Logo ---------- */
.dag-logo { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; }
.dag-logo__mark { width: 36px; height: 36px; color: var(--brand); }
.dag-logo__word {
  font-family: var(--font-display); font-weight: 600; font-size: 24px; line-height: 1;
  letter-spacing: -.4px; white-space: nowrap;
}
.dag-logo__word em { font-style: italic; font-weight: 500; color: var(--brand); }
.dag-logo--lg .dag-logo__mark { width: 64px; height: 64px; }
.dag-logo--lg .dag-logo__word { font-size: 40px; letter-spacing: -.8px; }
.dag-appicon {
  width: 72px; height: 72px; border-radius: 18px; background: var(--brand); color: var(--on-brand);
  display: grid; place-items: center; box-shadow: var(--shadow-card);
}
.dag-appicon svg { width: 46px; height: 46px; }

/* ---------- Button ---------- */
.dag-btn {
  appearance: none; border: 0; cursor: pointer;
  min-height: 52px; padding: 0 var(--space-6);
  border-radius: var(--radius-md);
  background: var(--brand); color: var(--on-brand);
  font-weight: 600; font-size: 16px; line-height: 24px;
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  transition: transform .12s ease, filter .12s ease;
}
.dag-btn:active { transform: scale(.98); filter: brightness(.95); }
.dag-btn--block { width: 100%; }
.dag-btn--secondary { background: var(--surface-raised); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line-strong); }
.dag-btn--ghost { background: transparent; color: var(--brand); padding: 0 var(--space-3); }
.dag-btn--sm { min-height: 40px; padding: 0 var(--space-4); font-size: 14px; border-radius: var(--radius-pill); }
.dag-btn--icon { width: 44px; min-height: 44px; padding: 0; border-radius: var(--radius-pill); }
.dag-btn .dag-icon { width: 20px; height: 20px; }

/* ---------- ScoreBadge ---------- */
.dag-score {
  display: inline-grid; place-items: center; flex: none;
  font-family: var(--font-display); font-weight: 600; font-variant-numeric: tabular-nums;
  width: 44px; height: 44px; border-radius: var(--radius-sm); font-size: 20px; line-height: 1;
  background: var(--surface-sunk); color: var(--ink);
}
.dag-score--sm { width: 34px; height: 34px; font-size: 16px; }
.dag-score--lg { width: 64px; height: 64px; font-size: 30px; border-radius: var(--radius-md); }
.dag-score--xl { width: auto; height: auto; padding: 10px 18px 12px; font-size: 64px; line-height: 60px; letter-spacing: -1.5px; border-radius: var(--radius-lg); }
.dag-score[data-band="top"]  { background: var(--brand); color: var(--on-brand); }
.dag-score[data-band="good"] { background: var(--accent); color: var(--on-accent); }
.dag-score[data-band="ok"]   { background: var(--surface-sunk); color: var(--ink); }
.dag-score[data-band="low"]  { background: var(--surface-raised); color: var(--danger); box-shadow: inset 0 0 0 1.5px var(--danger); }
.dag-band-word { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .8px; text-transform: uppercase; }
.dag-band-word[data-band="top"] { color: var(--brand); }
.dag-band-word[data-band="good"], .dag-band-word[data-band="ok"] { color: var(--ink-muted); }
.dag-band-word[data-band="low"] { color: var(--danger); }

/* ---------- ScorePicker (1–10) ---------- */
.dag-picker { display: flex; flex-direction: column; gap: var(--space-3); }
.dag-picker__readout { display: flex; align-items: baseline; gap: var(--space-3); }
.dag-picker__value { font-family: var(--font-display); font-weight: 600; font-size: 64px; line-height: 60px; letter-spacing: -1.5px; color: var(--ink); }
.dag-picker__of { font-family: var(--font-display); font-size: 20px; color: var(--ink-muted); }
.dag-picker__scale { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.dag-picker__opt {
  appearance: none; border: 0; cursor: pointer; height: 44px; border-radius: var(--radius-sm);
  background: var(--surface-sunk); color: var(--ink);
  font-family: var(--font-display); font-weight: 600; font-size: 17px; font-variant-numeric: tabular-nums;
}
.dag-picker__opt[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); }
.dag-picker__opt[data-filled="true"]:not([aria-pressed="true"]) { background: var(--brand-tint); }
.dag-picker--compact .dag-picker__opt { height: 40px; font-size: 15px; }

/* ---------- AspectRating (granos 1–5) ---------- */
.dag-aspects { display: flex; flex-direction: column; }
.dag-aspect {
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
  min-height: 52px; border-bottom: 1px solid var(--line);
}
.dag-aspect:last-child { border-bottom: 0; }
.dag-aspect__name { display: flex; align-items: center; gap: var(--space-2); font-weight: 500; }
.dag-aspect__name .dag-icon { width: 20px; height: 20px; color: var(--ink-muted); }
.dag-beans { display: flex; gap: 2px; }
.dag-bean {
  appearance: none; border: 0; background: none; padding: 0; cursor: pointer;
  width: 30px; height: 44px; display: grid; place-items: center; color: var(--line-strong);
}
.dag-bean svg { width: 22px; height: 22px; }
.dag-bean svg .fill { fill: transparent; }
.dag-bean[data-on="true"] { color: var(--brand); }
.dag-bean[data-on="true"] svg .fill { fill: var(--brand); }
.dag-bean[data-on="true"] svg .crease { stroke: var(--surface-raised); }
.dag-beans--read .dag-bean { width: 18px; height: 20px; cursor: default; }
.dag-beans--read .dag-bean svg { width: 16px; height: 16px; }

/* Barra de aspecto (lectura) */
.dag-bar { display: grid; grid-template-columns: 110px 1fr 28px; align-items: center; gap: var(--space-3); min-height: 32px; font-size: 14px; }
.dag-bar__track { height: 8px; border-radius: var(--radius-pill); background: var(--surface-sunk); overflow: hidden; }
.dag-bar__fill { height: 100%; border-radius: inherit; background: var(--brand); }
.dag-bar__val { font-family: var(--font-display); font-weight: 600; text-align: right; }

/* ---------- Chips (grano, filtros) ---------- */
.dag-chips { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.dag-chips--scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--space-4)); padding: 0 var(--space-4); }
.dag-chip {
  appearance: none; cursor: pointer; flex: none;
  min-height: 36px; padding: 0 14px; border-radius: var(--radius-pill);
  border: 1.5px solid var(--line-strong); background: var(--surface-raised); color: var(--ink);
  font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px;
}
.dag-chip .dag-icon { width: 16px; height: 16px; }
.dag-chip[aria-pressed="true"] { background: var(--brand-tint); border-color: var(--brand); font-weight: 600; }
.dag-chip--solid[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.dag-tag {
  display: inline-flex; align-items: center; gap: 4px; min-height: 26px; padding: 0 10px;
  border-radius: var(--radius-pill); background: var(--surface-sunk); color: var(--ink);
  font-size: 13px; font-weight: 500;
}
.dag-tag--wish { background: var(--bean-green-tint); color: var(--bean-green); font-weight: 600; }
.dag-tag .dag-icon { width: 14px; height: 14px; }

/* ---------- Campos ---------- */
.dag-field { display: flex; flex-direction: column; gap: var(--space-2); }
.dag-input, .dag-textarea {
  width: 100%; border: 1.5px solid var(--line-strong); border-radius: var(--radius-sm);
  background: var(--surface-raised); color: var(--ink); padding: 12px 14px; font-size: 16px; line-height: 24px;
}
.dag-input { min-height: 48px; }
.dag-textarea { min-height: 132px; resize: vertical; border-radius: var(--radius-md); }
.dag-input::placeholder, .dag-textarea::placeholder { color: var(--ink-muted); }
.dag-input:focus, .dag-textarea:focus { border-color: var(--brand); outline: 2px solid var(--focus); outline-offset: 1px; }
.dag-field__hint { display: flex; justify-content: space-between; font-size: 13px; line-height: 18px; color: var(--ink-muted); }
.dag-search {
  display: flex; align-items: center; gap: var(--space-2); min-height: 48px; padding: 0 14px;
  border-radius: var(--radius-pill); background: var(--surface-raised); box-shadow: inset 0 0 0 1.5px var(--line-strong);
  color: var(--ink-muted);
}
.dag-search .dag-icon { width: 20px; height: 20px; }

/* ---------- Switch ---------- */
.dag-switch { appearance: none; border: 0; cursor: pointer; width: 52px; height: 32px; border-radius: var(--radius-pill); background: var(--surface-sunk); box-shadow: inset 0 0 0 1.5px var(--line-strong); position: relative; flex: none; padding: 0; }
.dag-switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: var(--ink-muted); transition: transform .18s ease, background .18s; }
.dag-switch[aria-checked="true"] { background: var(--brand); box-shadow: none; }
.dag-switch[aria-checked="true"]::after { transform: translateX(20px); background: var(--on-brand); }

/* ---------- Card ---------- */
.dag-card { background: var(--surface-raised); border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: var(--space-4); }
.dag-card--lg { border-radius: var(--radius-lg); }
.dag-section { display: flex; flex-direction: column; gap: var(--space-3); }
.dag-section + .dag-section { margin-top: var(--space-6); }
.dag-section__head { display: flex; align-items: center; justify-content: space-between; }

/* ---------- FoodReview ---------- */
.dag-food { display: flex; flex-direction: column; gap: var(--space-4); }
.dag-food__toggle { display: flex; align-items: center; gap: var(--space-3); }
.dag-food__toggle .dag-icon { color: var(--brand); }
.dag-food__q { flex: 1; font-weight: 600; }
.dag-food__body { display: flex; flex-direction: column; gap: var(--space-4); padding-top: var(--space-4); border-top: 1px solid var(--line); }
.dag-food[data-open="false"] .dag-food__body { display: none; }

/* ---------- CafeCard (ranking) ---------- */
.dag-cafe {
  display: grid; grid-template-columns: 28px 52px 1fr auto; align-items: center; gap: var(--space-3);
  padding: var(--space-3); padding-right: var(--space-4);
  background: var(--surface-raised); border-radius: var(--radius-md); box-shadow: var(--shadow-card);
  text-decoration: none; color: inherit;
}
.dag-cafe__rank { font-family: var(--font-display); font-weight: 600; font-size: 20px; color: var(--ink-muted); text-align: center; font-variant-numeric: tabular-nums; }
.dag-cafe__thumb { width: 52px; height: 52px; border-radius: var(--radius-sm); background: var(--surface-sunk); display: grid; place-items: center; color: var(--ink-muted); overflow: hidden; }
.dag-cafe__thumb .dag-icon { width: 26px; height: 26px; }
.dag-cafe__info { min-width: 0; }
.dag-cafe__name { font-family: var(--font-display); font-weight: 600; font-size: 18px; line-height: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0; }
.dag-cafe__meta { font-size: 14px; line-height: 20px; color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0; }
.dag-cafe__meta .dag-icon { width: 14px; height: 14px; vertical-align: -2px; }

.dag-hero {
  position: relative; overflow: hidden; border-radius: var(--radius-lg); padding: var(--space-4);
  background: var(--brand); color: var(--on-brand); display: grid; grid-template-columns: 1fr auto; gap: var(--space-2) var(--space-4); align-items: end;
}
.dag-hero__crown { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .8px; text-transform: uppercase; grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; }
.dag-hero__crown .dag-icon { width: 16px; height: 16px; }
.dag-hero__name { font-family: var(--font-display); font-weight: 600; font-size: 28px; line-height: 30px; letter-spacing: -.4px; margin: 0; }
.dag-hero__meta { font-size: 14px; line-height: 20px; margin: 4px 0 0; opacity: .9; }
.dag-hero__score { font-family: var(--font-display); font-weight: 600; font-size: 64px; line-height: 56px; letter-spacing: -1.5px; }
.dag-hero__bean { position: absolute; right: -28px; top: -34px; width: 150px; height: 150px; opacity: .14; color: var(--on-brand); pointer-events: none; }

/* ---------- Map ---------- */
.dag-map { position: relative; overflow: hidden; border-radius: var(--radius-lg); background: var(--map-land); }
.dag-map > svg.dag-map__base { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.dag-map__base .road { stroke: var(--map-road); fill: none; stroke-linecap: round; }
.dag-map__base .water { fill: var(--map-water); }
.dag-map__base .land { fill: var(--map-land); }
.dag-pin {
  position: absolute; transform: translate(-50%, -100%);
  appearance: none; border: 0; padding: 0; background: none; cursor: pointer; filter: drop-shadow(0 2px 3px rgba(0,0,0,.25));
}
.dag-pin__body {
  display: grid; place-items: center; min-width: 36px; height: 36px; padding: 0 8px; border-radius: var(--radius-pill);
  background: var(--brand); color: var(--on-brand); font-family: var(--font-display); font-weight: 600; font-size: 16px;
  box-shadow: 0 0 0 2px var(--surface-raised);
}
.dag-pin__tip { display: block; width: 2px; height: 10px; margin: 0 auto; background: var(--brand); }
.dag-pin[data-band="good"] .dag-pin__body { background: var(--accent); color: var(--on-accent); }
.dag-pin[data-band="good"] .dag-pin__tip { background: var(--accent); }
.dag-pin[data-band="ok"] .dag-pin__body { background: var(--surface-raised); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line-strong), 0 0 0 2px var(--surface-raised); }
.dag-pin[data-band="ok"] .dag-pin__tip { background: var(--line-strong); }
.dag-pin--wish .dag-pin__body { background: var(--bean-green-tint); color: var(--bean-green); box-shadow: inset 0 0 0 2px var(--bean-green); padding: 0; width: 34px; min-width: 34px; height: 34px; }
.dag-pin--wish .dag-pin__body .dag-icon { width: 18px; height: 18px; }
.dag-pin--wish .dag-pin__tip { background: var(--bean-green); }
.dag-pin[aria-pressed="true"] .dag-pin__body { transform: scale(1.18); box-shadow: 0 0 0 3px var(--ink); }
.dag-me { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 4px var(--surface-raised), 0 0 0 12px rgba(140, 69, 24, .18); transform: translate(-50%, -50%); }
.dag-sheet {
  background: var(--surface-raised); border-radius: var(--radius-lg) var(--radius-lg) 0 0; box-shadow: var(--shadow-float);
  padding: 10px var(--space-4) var(--space-4);
}
.dag-sheet__grip { width: 40px; height: 5px; border-radius: var(--radius-pill); background: var(--line); margin: 0 auto var(--space-3); }

/* ---------- Wishlist ---------- */
.dag-wish {
  display: grid; grid-template-columns: 44px 1fr; gap: var(--space-3); padding: var(--space-4);
  background: var(--surface-raised); border-radius: var(--radius-md); box-shadow: var(--shadow-card);
}
.dag-wish__icon { width: 44px; height: 44px; border-radius: var(--radius-pill); background: var(--bean-green-tint); color: var(--bean-green); display: grid; place-items: center; }
.dag-wish__name { font-family: var(--font-display); font-weight: 600; font-size: 18px; line-height: 24px; margin: 0; }
.dag-wish__meta { font-size: 14px; line-height: 20px; color: var(--ink-muted); margin: 0; }
.dag-wish__note { font-size: 14px; line-height: 20px; margin: var(--space-2) 0 0; padding: 8px 12px; border-radius: var(--radius-sm); background: var(--surface-sunk); }
.dag-wish__note b { font-weight: 600; }
.dag-wish__actions { grid-column: 2; display: flex; gap: var(--space-2); margin-top: var(--space-1); }

/* ---------- TabBar ---------- */
.dag-tabbar {
  display: grid; grid-template-columns: 1fr 1fr 64px 1fr 1fr; align-items: center;
  height: 68px; padding: 0 6px; border-radius: var(--radius-pill);
  background: var(--surface-raised); box-shadow: var(--shadow-float), inset 0 0 0 1px var(--line);
}
.dag-tab {
  appearance: none; border: 0; background: none; cursor: pointer; height: 56px; border-radius: var(--radius-pill);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--ink-muted); font-size: 11px; line-height: 14px; font-weight: 500;
}
.dag-tab .dag-icon { width: 24px; height: 24px; }
.dag-tab[aria-current="page"] { color: var(--brand); font-weight: 600; }
.dag-tab[aria-current="page"]::after { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--brand); margin-top: 1px; }
.dag-fab {
  appearance: none; border: 0; cursor: pointer; justify-self: center;
  width: 56px; height: 56px; border-radius: var(--radius-pill); background: var(--brand); color: var(--on-brand);
  display: grid; place-items: center; box-shadow: var(--shadow-float);
}
.dag-fab .dag-icon { width: 28px; height: 28px; }

/* ---------- Phone frame (solo para pantallas de muestra) ---------- */
.dag-phone {
  width: 390px; height: 844px; border-radius: 46px; overflow: hidden; position: relative; flex: none;
  background: var(--surface); box-shadow: 0 0 0 10px #0b0705, 0 0 0 11px var(--line), 0 24px 60px rgba(36,23,15,.25);
  display: flex; flex-direction: column;
}
.dag-status { height: 50px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 34px; font-size: 15px; font-weight: 600; }
.dag-status__dots { display: flex; gap: 5px; align-items: center; }
.dag-status__dots i { display: block; width: 17px; height: 10px; border-radius: 3px; background: var(--ink); }
.dag-status__dots i:first-child { width: 14px; border-radius: 2px; opacity: .8; }
.dag-screen { flex: 1; overflow: hidden; padding: 0 var(--space-4) 110px; position: relative; }
.dag-screen__head { display: flex; align-items: center; justify-content: space-between; padding: var(--space-2) 0 var(--space-4); }
.dag-phone > .dag-tabbar { position: absolute; left: 14px; right: 14px; bottom: 26px; }
.dag-topbar { display: flex; align-items: center; justify-content: space-between; height: 52px; }
.dag-topbar__title { font-weight: 600; }
.dag-gallery { display: flex; gap: 48px; padding: 24px 24px 40px; align-items: flex-start; }
.dag-gallery__cap { font-size: 13px; color: var(--ink-muted); margin: 18px 0 0 6px; }
